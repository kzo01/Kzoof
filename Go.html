<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Twitter Post Card</title>
  
  <!-- Open Graph Meta Tags (Twitter aur Social Media Card ke liye) -->
  <meta property="og:title" content="Check this out!" />
  <meta property="og:description" content="me 18:20" />
  <meta property="og:image" content="https://cdn.corenexis.com/f/k5D0L8Ulpv9.jpg" />
  <meta property="og:url" content="https://pingurl.io/av8MEng" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Check this out!" />
  <meta name="twitter:description" content="me 18:20" />
  <meta name="twitter:image" content="https://cdn.corenexis.com/f/k5D0L8Ulpv9.jpg" />

  <!-- Direct Redirect Option -->
  <meta http-equiv="refresh" content="0; url=https://pingurl.io/av8MEng" />
</head>
<body>
  <p>Redirecting... If not redirected, <a href="https://pingurl.io/av8MEng">click here</a>.</p>
</body>
</html>
