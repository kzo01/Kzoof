<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step in sign up ☺️</title>

    <!-- Facebook / WhatsApp Open Graph Meta Tags -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Step in sign up ☺️">
    <meta property="og:description" content="Click here to watch full video and register.">
    <meta property="og:video" content="https://files.catbox.moe/guwy5p.mp4">
    <meta property="og:video:type" content="video/mp4">

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="player">
    <meta name="twitter:title" content="Step in sign up ☺️">
    <meta name="twitter:description" content="Step in sign up ☺️">
    <meta name="twitter:player" content="https://files.catbox.moe/guwy5p.mp4">
    <meta name="twitter:player:width" content="800">
    <meta name="twitter:player:height" content="455">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: Arial, sans-serif;
        }
        .main-link {
            display: block;
            width: 100%;
            height: 100%;
            text-decoration: none;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        .banner-text {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ffffff44;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Poore Screen par tap/click karne par Smartlink khulega -->
    <a href="https://suszhi.com/2108880" class="main-link">
        <!-- Autoplay, Loop video GIF style mein -->
        <video autoplay loop muted playsinline>
            <source src="https://files.catbox.moe/guwy5p.mp4" type="video/mp4">
        </video>
        <!-- Overlay text -->
        <div class="banner-text">Step in sign up ☺️</div>
    </a>

</body>
</html>
